name: Mutation Testing

on:
  push:
    branches: [main]
    paths:
      - 'src/domain/**'
      - 'src/ports/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mutation:
    name: Mutation Testing (Per-Feature)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Find changed domain and port files
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # First push of a branch sends an all-zero `before`; a force-push can
          # send one that is no longer in the history. Fall back to the pushed
          # commit's own diff in both cases.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-parse --verify -q "$SHA^" || git hash-object -t tree /dev/null)"
          fi
          files="$(git diff --name-only --diff-filter=d "$BEFORE" "$SHA" -- 'src/domain/*.ts' 'src/ports/*.ts' \
            | grep -v '\.test\.ts$' | paste -sd, - || true)"
          echo "Changed files to mutate: ${files:-<none>}"
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Run Stryker mutation testing
        if: steps.changed.outputs.files != ''
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: npx stryker run --mutate "$FILES"

      - name: Upload mutation report
        if: always() && steps.changed.outputs.files != ''
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 7
          if-no-files-found: ignore
