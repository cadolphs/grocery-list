name: PR hygiene

# Deterministic PR checks, kept out of ci.yml (issue #73): the body must
# follow the PR template, and a PR may declare a higher Risk than its changed
# paths imply, never a lower one. `Friction: none` needs the `friction-skipped`
# label, so this re-runs when labels change. CI must not: `gh pr create
# --label` fires `opened` and `labeled` together, and the duplicate CI run that
# the concurrency group cancels reads as a failed check to the ship-pr
# autopilot, which looks at every check run on the head commit.
#
# For the same reason this workflow never cancels a run. It has no
# `concurrency:` group at all: a group keeps at most one pending run, so a
# third event (`opened` + two `labeled`, or `opened` + `labeled` + `edited`)
# would cancel the waiting run even with cancel-in-progress off. Runs only
# read, so they can overlap. Each reads the PR as it is now (`gh api`), not
# the event payload, so both runs of that `opened` + `labeled` pair see the
# label and pass. The `opened` payload of a PR created with `--label` has no
# labels yet, which is what made the re-run necessary.
# Dependabot PRs have generated bodies, so they are exempt.

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hygiene:
    name: PR hygiene
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check-risk-tier diffs against origin/<base>

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The scripts take the body and labels from the environment (see their
      # headers); the values come from the live PR, not the event payload.
      - name: Read the PR as it is now
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"

      # `gh pr create --label X` adds the label in a second API call after the
      # PR exists. If the `opened` run reads the PR before that call lands,
      # `Friction: none` has no label yet and fails, and that failed run would
      # stay on the head SHA. So on `opened` only, a failed body check is
      # retried once after 20 s with a fresh read of the PR.
      - name: Check PR body follows the template
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RETRY_ONCE: ${{ github.event.action == 'opened' }}
        run: |
          check() {
            PR_BODY="$(jq -r '.body // ""' "$RUNNER_TEMP/pr.json")" \
            PR_LABELS="$(jq -c '[.labels[].name]' "$RUNNER_TEMP/pr.json")" \
            node scripts/check-pr-body.mjs
          }
          if check; then exit 0; fi
          if [ "$RETRY_ONCE" != "true" ]; then exit 1; fi
          echo "Body check failed on 'opened': re-reading the PR in 20 s in case a label is still landing."
          sleep 20
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          check

      - name: Check declared risk tier
        run: |
          PR_BODY="$(jq -r '.body // ""' "$RUNNER_TEMP/pr.json")" \
          node scripts/check-risk-tier.mjs "origin/${{ github.base_ref }}"
