name: CI

on:
  push:
    branches: [main]
  # Weekly run: advisories appear and allowlist entries expire without commits.
  schedule:
    - cron: '0 7 * * 1'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  commit-stage:
    name: Commit Stage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same single gate agents and humans run locally (AGENTS.md):
      # typecheck, lint (incl. no-classes and layer-boundary rules), format
      # check, sibling-test check, feature-map check, dead-code check, jest.
      - name: Verify
        run: npm run verify

      # Blocks on high/critical advisories in shipped dependencies unless they
      # are on .github/audit-allowlist.json (reason + expiry); see AGENTS.md.
      - name: Security audit
        run: node scripts/check-audit.mjs

      # PR hygiene, deterministic: the body must follow the PR template, and a
      # PR may declare a higher Risk than its paths imply, never a lower one.
      # Dependabot PRs have generated bodies, so they are exempt.
      - name: Check PR body follows the template
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/check-pr-body.mjs

      - name: Check declared risk tier
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-risk-tier.mjs "origin/${{ github.base_ref }}"
