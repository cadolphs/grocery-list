name: CI

on:
  push:
    branches: [main]
  # Weekly run: advisories appear and allowlist entries expire without commits.
  schedule:
    - cron: '0 7 * * 1'
  # Only events that change the code: PR-body and label checks live in
  # pr-hygiene.yml, so that a label added together with `opened` (as
  # `gh pr create --label` does) never starts a second CI run that the
  # concurrency group then cancels (issue #73).
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  commit-stage:
    name: Commit Stage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same single gate agents and humans run locally (AGENTS.md):
      # typecheck, lint (incl. no-classes and layer-boundary rules), format
      # check, sibling-test check, feature-map check, dead-code check, jest.
      - name: Verify
        run: npm run verify

      # Blocks on high/critical advisories in shipped dependencies unless they
      # are on .github/audit-allowlist.json (reason + expiry); see AGENTS.md.
      - name: Security audit
        run: node scripts/check-audit.mjs
