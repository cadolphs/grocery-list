name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  commit-stage:
    name: Commit Stage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same single gate agents and humans run locally (AGENTS.md):
      # typecheck, lint (incl. no-classes and layer-boundary rules), format
      # check, sibling-test check, feature-map check, dead-code check, jest.
      - name: Verify
        run: npm run verify

      - name: Security audit
        run: npm audit --audit-level=high || true

      # A PR may declare a higher Risk than its paths imply, never a lower one.
      - name: Check declared risk tier
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-risk-tier.mjs "origin/${{ github.base_ref }}"
