name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  commit-stage:
    name: Commit Stage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same single gate agents and humans run locally (AGENTS.md):
      # typecheck, lint (incl. no-classes and layer-boundary rules), format
      # check, sibling-test check, feature-map check, dead-code check, jest.
      - name: Verify
        run: npm run verify

      - name: Security audit
        run: npm audit --audit-level=high || true
